[package]
name = "rscm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core traits and functionalities for the creation of reduced-complexity climate models"
readme = "README.md"

[features]
default = ["rich-debug"]
rich-debug = ["owo-colors"]

[dependencies]
ode_solvers = "0.6.2"
ndarray = { version = "0.17", features = ["serde"] }
numpy = "0.27.1"
# Pinned to match ode_solvers requirement
nalgebra = "0.34.2"
petgraph = { version = "0.8.3", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive", "rc"] }
# Records must restore every value exactly.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
typetag = "0.2"
log = "0.4"
num = "0.4"
is_close = "0.1"
thiserror = "2.0"
strsim = "0.11"
pythonize = "0.27.0"
serde_path_to_error = "0.1"
rayon.workspace = true
owo-colors = { version = "4", optional = true }
rscm-macros.workspace = true
tracing.workspace = true

[dependencies.pyo3]
version = "0.27.2"
# "abi3-py313" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.13
features = ["abi3-py313", "multiple-pymethods"]

[dev-dependencies]
toml = "0.9"

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "katex-header.html" ]

[lints]
workspace = true
