# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v4.4.0'
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        args: ['--unsafe']  # Allow PyYAML constructors (used by mkdocs-material)
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      # Prevent committing .rej files
      - id: forbidden-files
        name: forbidden files
        entry: found Copier update rejection files; review them and remove them
        language: fail
        files: "\\.rej$"
      - id: changelog-punctuation
        name: changelog punctuation (no semicolons, em or en dashes, spaced hyphens)
        language: pygrep
        entry: "[;—–]|\\S - "
        files: "^changelog/.*\\.md$"
        exclude: "^changelog/README\\.md$"
      - id: naming-denylist
        name: retired identifiers (naming-denylist.txt)
        language: python
        entry: python scripts/check_naming.py
        types: [text]
      # stubtest cannot see TypedDicts, so this compares them with the serialised Rust parameters.
      - id: magicc-stub-parameters
        name: magicc.pyi parameter TypedDicts match Rust
        language: system
        entry: >-
          bash -c 'LD_LIBRARY_PATH="$(uv run --no-sync python -c "import sysconfig; print(sysconfig.get_config_var(\"LIBDIR\"))")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test -q -p rscm-magicc --test python_stub_parameters'
        files: "^(python/rscm/_lib/magicc\\.pyi|crates/rscm-magicc/src/parameters/.*\\.rs)$"
        pass_filenames: false
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 'v0.14.11'
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/FeryET/pre-commit-rust
    rev: v1.2.1
    hooks:
      - id: fmt
      - id: cargo-check
