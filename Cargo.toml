
[workspace]
members = [
    # Python interface
    "crates/rscm",
    # Core functionality
    "crates/rscm-core",
    "crates/rscm-components",
    # Utilities and macros
    "crates/rscm-macros",
    "crates/rscm-doc-gen",
    # Models
    "crates/rscm-two-layer",
    "crates/rscm-magicc",
    "crates/rscm-fair",
    # Calibration
    "crates/rscm-calibrate",
]
resolver = "2"

[workspace.lints.clippy]
# Index loops read closer to the reference maths in the numerical code.
needless_range_loop = "allow"

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lewisjared/rscm"
authors = ["Jared Lewis <jared.lewis@climate-resource.com>"]
keywords = ["physics", "scm", "climate"]
categories = ["science"]

[workspace.dependencies]
rscm-core = { version = "0.7.0", path = "crates/rscm-core" }
rscm-components = { version = "0.7.0", path = "crates/rscm-components" }
rscm-macros = { version = "0.7.0", path = "crates/rscm-macros" }
rscm-two-layer = { version = "0.7.0", path = "crates/rscm-two-layer" }
rscm-magicc = { version = "0.7.0", path = "crates/rscm-magicc" }
rscm-fair = { version = "0.7.0", path = "crates/rscm-fair" }
rscm-calibrate = { version = "0.7.0", path = "crates/rscm-calibrate" }
pyo3 = { version = "0.27.2", features = ["abi3-py313"] }
numpy = "0.27.1"
rayon = "1.10"
tracing = "0.1"
